<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tynmas Labs · Let’s Connect</title>
<meta name="description" content="Help Tynmas Labs make 3D printing more useful, accessible and relevant to you. A 2-minute feedback survey.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070F">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&family=DM+Sans:wght@400;500;600;700&display=swap">
<style id="css">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ground:#F0F6FC;--surface:#FFFFFF;--surface-2:#F7FAFD;--text:#17181B;--muted:#6E6E6E;
  --accent:#415DDD;--accent-deep:#2F49C4;--accent-ink:#FFFFFF;--accent-soft:#415DDD;--tint:rgba(65,93,221,.09);--tint-2:rgba(65,93,221,.2);
  --border:rgba(5,16,66,.09);--border-strong:rgba(5,16,66,.2);--deep:#051042;--on-deep:#FFFFFF;--on-deep-muted:#B9C3E6;
  --ok:#15803D;--ok-tint:#DCFCE7;--warn:#C2540A;--warn-tint:#FFF1E7;--danger:#D92D2D;
  --shadow:0 10px 30px rgba(5,16,66,.10);--r-md:11px;--r-lg:15px;--r-xl:20px;--pill:500px;--focus:rgba(65,93,221,.4);--grid:rgba(5,16,66,.10);--logo-filter:invert(1);--art:.16
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#05070F;--surface:#0E1428;--surface-2:#131B36;--text:#FFFFFF;--muted:#A6ADB8;
    --accent:#5470E8;--accent-deep:#415DDD;--accent-ink:#FFFFFF;--accent-soft:#7C93F0;--tint:rgba(84,112,232,.14);--tint-2:rgba(84,112,232,.3);
    --border:rgba(255,255,255,.11);--border-strong:rgba(255,255,255,.22);--deep:#10142A;--on-deep:#FFFFFF;--on-deep-muted:#A6ADB8;
    --ok:#4ADE80;--ok-tint:rgba(74,222,128,.14);--warn:#F97316;--warn-tint:rgba(249,115,22,.14);--danger:#F58A8A;
    --shadow:0 12px 32px rgba(0,0,0,.4);--focus:rgba(84,112,232,.5);--grid:rgba(255,255,255,.07);--logo-filter:none;--art:.22
  }
}
:root[data-theme="dark"]{
  --ground:#05070F;--surface:#0E1428;--surface-2:#131B36;--text:#FFFFFF;--muted:#A6ADB8;
  --accent:#5470E8;--accent-deep:#415DDD;--accent-ink:#FFFFFF;--accent-soft:#7C93F0;--tint:rgba(84,112,232,.14);--tint-2:rgba(84,112,232,.3);
  --border:rgba(255,255,255,.11);--border-strong:rgba(255,255,255,.22);--deep:#10142A;--on-deep:#FFFFFF;--on-deep-muted:#A6ADB8;
  --ok:#4ADE80;--ok-tint:rgba(74,222,128,.14);--warn:#F97316;--warn-tint:rgba(249,115,22,.14);--danger:#F58A8A;
  --shadow:0 12px 32px rgba(0,0,0,.4);--focus:rgba(84,112,232,.5);--grid:rgba(255,255,255,.07);--logo-filter:none;--art:.22
}
html{-webkit-text-size-adjust:100%}
body{font-family:"DM Sans","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;background:var(--ground);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent)}
h1,h2,h3,.disp{font-family:Questrial,"DM Sans",sans-serif;font-weight:400;letter-spacing:-.01em}
.ic{display:inline-block;vertical-align:middle;flex:none}
.shell{max-width:720px;margin:0 auto;padding:14px 14px 56px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft)}
.sec-head{display:flex;flex-direction:column;gap:6px;padding:6px 4px 0}
.sec-head h2{font-size:24px;line-height:1.15;text-wrap:balance}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:38px;height:38px;border-radius:9px;filter:var(--logo-filter);display:block}
.brand b{font-family:Questrial,sans-serif;font-weight:400;font-size:18px;letter-spacing:.04em;display:block;line-height:1.05}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.livepill{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 12px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--border-strong);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.livepill:hover{border-color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}70%{box-shadow:0 0 0 8px rgba(21,128,61,0)}100%{box-shadow:0 0 0 0 rgba(21,128,61,0)}}
/* hero (always dark, photo-led like the site) */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);color:#fff;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 22px 24px;box-shadow:var(--shadow);background:#05070F}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%;opacity:.9}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.15) 0%,rgba(5,7,15,.55) 45%,rgba(5,7,15,.92) 100%)}
.hero>*{position:relative}
.hero .chipline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.chip-made{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--pill);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px)}
.tagline{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#C9D3FF}
.tagline i{font-style:normal;opacity:.5;margin:0 6px}
.hero h1{font-family:"DM Sans",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(34px,8vw,50px);line-height:1.02;max-width:20ch;text-wrap:balance}
.hero h1 span{color:var(--accent-soft)}
.hero p b{color:var(--accent-soft);font-weight:700;text-transform:uppercase}
.hero p{margin-top:14px;color:rgba(255,255,255,.82);max-width:46ch;font-size:15.5px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-live{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.7)}
.hero-live b{color:#fff}
/* perspective grid band (site motif) */
.gridband{position:relative;overflow:hidden;border-radius:var(--r-xl);margin:-6px 0 -6px;height:70px;pointer-events:none}
.gridband::before{content:"";position:absolute;left:-30%;right:-30%;top:-40px;bottom:-140px;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px;transform:perspective(320px) rotateX(58deg);transform-origin:50% 0;-webkit-mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:14px 22px;border-radius:var(--pill);border:1.5px solid transparent;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tile:focus-visible,.chip:focus-visible,.toggle:focus-visible,.livepill:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--tint)}
.hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.hero .btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-lg{padding:16px 26px;font-size:13px}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn-danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
/* cards + background product art */
.card{position:relative;overflow:clip;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:22px 20px;box-shadow:var(--shadow)}
@media (min-width:560px){.card{padding:28px 28px}}
.card>*{position:relative}
.card-art{position:absolute;right:-50px;top:-40px;width:300px;height:300px;object-fit:cover;border-radius:50%;opacity:var(--art);pointer-events:none;-webkit-mask:radial-gradient(circle at 50% 50%,#000 25%,transparent 70%);mask:radial-gradient(circle at 50% 50%,#000 25%,transparent 70%);animation:artin 1s both}
@keyframes artin{from{opacity:0;transform:scale(.9) rotate(-6deg)}to{opacity:var(--art);transform:none}}
.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* process (01/02/03 like the site) */
.process{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.process{grid-template-columns:repeat(3,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.pcard .n{font-family:Questrial,sans-serif;color:var(--accent-soft);font-size:13px;letter-spacing:.08em}
.pcard h3{font-size:18px}
.pcard p{font-size:13.5px;color:var(--muted);line-height:1.45}
.pcard svg{color:var(--accent-soft);margin-bottom:4px}
/* values */
.values{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.values{grid-template-columns:repeat(4,1fr)}}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 14px}
.vcard svg{color:var(--accent-soft);margin-bottom:8px}
.vcard b{display:block;font-family:Questrial,sans-serif;font-weight:400;font-size:15.5px;line-height:1.2}
.vcard p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
/* progress */
.progress{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.rail{display:flex;gap:5px}
.rail i{flex:1;height:5px;border-radius:99px;background:var(--border-strong);opacity:.5;transition:background .3s}
.rail i.done{background:var(--accent);opacity:1}
.rail i.now{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);opacity:1;box-shadow:inset 0 0 0 1px var(--border-strong)}
.progress-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.step-head{display:flex;flex-direction:column;gap:4px;margin-bottom:18px;padding-right:60px}
.num{font-family:Questrial,sans-serif;color:var(--accent-soft);font-size:13px;letter-spacing:.1em}
.step-head h2{font-size:23px;line-height:1.2;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin-top:3px}
.step-nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.step-nav .btn-primary{flex:1}
.err{margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-tint);color:var(--warn);font-weight:600;font-size:14px}
/* fields */
.fields{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:520px){.fields{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field label em{font-style:normal;color:var(--accent-soft)}
.field input,.field textarea{width:100%;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
/* tiles */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:420px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tiles-5{grid-template-columns:repeat(2,1fr)}
@media (min-width:420px){.tiles-5{grid-template-columns:repeat(3,1fr)}}
@media (min-width:600px){.tiles-5{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 14px;border-radius:var(--r-lg);border:1px solid var(--border-strong);background:var(--surface-2);text-align:center;font-size:13px;font-weight:500;line-height:1.3;color:var(--text);transition:border-color .15s,background .15s,transform .15s}
.tile svg{color:var(--accent-soft);transition:transform .2s}
.tile:hover{border-color:var(--accent)}
.tile[aria-checked="true"]{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.tile[aria-checked="true"] svg{transform:scale(1.1)}
.tile .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.tile[aria-checked="true"] .tick{display:grid}
.tile .tick svg{color:#fff}
.tile-other{margin-top:10px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--pill);border:1px solid var(--border-strong);background:var(--surface-2);font-weight:500;font-size:14px;color:var(--text);transition:border-color .15s,background .15s}
.chip .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;color:#fff;flex:none}
.chip:hover{border-color:var(--accent)}
.chip[aria-checked="true"]{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.chip[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.chip .box svg{opacity:0}
.chip[aria-checked="true"] .box svg{opacity:1}
/* toggles */
.toggles{display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--border-strong);background:var(--surface-2);text-align:left;transition:border-color .15s,background .15s}
.toggle svg{color:var(--accent-soft)}
.toggle span{flex:1;font-weight:500;font-size:14.5px}
.toggle .sw{width:46px;height:26px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked="true"]{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 1px var(--accent)}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(20px)}
/* suggestions */
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.suggest .label{width:100%;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.suggest button{font-size:13px;padding:7px 13px;border-radius:var(--pill);border:1px dashed var(--border-strong);color:var(--muted)}
.suggest button:hover{color:var(--accent);border-color:var(--accent)}
/* photos: gallery, inspiration strip, thank-you panel */
.made{display:flex;flex-direction:column;gap:12px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.gallery{grid-template-columns:repeat(4,1fr)}}
.gcard{position:relative;margin:0;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);aspect-ratio:1/1.06;transition:transform .25s,box-shadow .25s;animation:enter .5s both}
.gcard:nth-child(2){animation-delay:.08s}.gcard:nth-child(3){animation-delay:.16s}.gcard:nth-child(4){animation-delay:.24s}
.gcard:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(5,16,66,.2)}
.gcard img{width:100%;height:100%;object-fit:cover;display:block}
.gcard figcaption{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(5,7,15,.78);color:#fff;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:var(--pill);backdrop-filter:blur(4px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inspo{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px;border-radius:var(--r-lg);background:var(--tint);flex-wrap:wrap}
.inspo img{width:48px;height:48px;border-radius:12px;object-fit:cover;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(5,16,66,.15);margin-right:-14px}
.inspo img:nth-of-type(4){margin-right:6px}
.inspo span{font-size:13px;color:var(--muted);font-weight:500;flex:1;min-width:160px}
/* thanks */
.thanks{text-align:center;padding-top:34px}
.thanks-mark{width:84px;height:84px;border-radius:50%;background:var(--ok-tint);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.thanks h2{font-size:38px;line-height:1.05}
.thanks p.sub{color:var(--muted);margin-top:8px;font-size:15.5px}
.note{margin:16px auto 0;max-width:46ch;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-tint);color:var(--warn);font-size:14px;font-weight:500;text-align:left}
.note.ok{background:var(--ok-tint);color:var(--ok)}
.booth{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;text-align:left;margin-top:22px;padding:16px;border-radius:var(--r-xl);background:var(--deep);color:var(--on-deep);border:1px solid var(--border)}
.booth img{width:88px;height:128px;object-fit:cover;border-radius:44px;display:block}
.booth b{font-family:Questrial,sans-serif;font-weight:400;font-size:19px;line-height:1.2;display:block}
.booth p{font-size:13.5px;color:var(--on-deep-muted);margin-top:4px}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.contact a{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--pill);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600}
.contact a:hover{background:var(--accent);border-color:var(--accent)}
.restart{margin-top:24px;padding-top:18px;border-top:1px dashed var(--border-strong);display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.restart .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* saving */
.saving{text-align:center;padding:60px 20px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--tint-2);border-top-color:var(--accent);margin:0 auto 16px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* results */
.rhead{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--border)}
.rhead>*{position:relative}
.rhead h2{font-size:30px}
.rhead .sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:2px}
.newbadge{display:inline-block;padding:3px 9px;border-radius:var(--pill);background:var(--ok-tint);color:var(--ok);font-weight:700;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 14px 12px;box-shadow:var(--shadow)}
.stat small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:Questrial,sans-serif;font-weight:400;font-size:32px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hi{background:var(--accent);color:#fff;border-color:var(--accent)}
.stat.hi small,.stat.hi span{color:rgba(255,255,255,.75)}
.panel h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 svg{color:var(--accent-soft)}
.panel h3 .n{margin-left:auto;font-size:12px;color:var(--muted);font-family:"DM Sans",sans-serif}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:200px}
.ladder .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;text-align:center}
.ladder .barwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0;padding-top:26px}
.ladder .bar{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--accent-soft),var(--accent));height:0;transition:height .8s cubic-bezier(.2,.7,.2,1);position:relative;min-height:4px}
.ladder .bar[data-h="0"]{background:var(--border-strong)}
.ladder .val{position:absolute;left:0;right:0;bottom:calc(100% + 4px);text-align:center;font-family:Questrial,sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
.ladder .lab{font-size:10.5px;color:var(--muted);line-height:1.2;font-weight:500;height:2.6em}
.ladder svg{color:var(--accent-soft)}
/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.brow .lab{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.brow .lab svg{color:var(--accent-soft)}
.brow .val{font-family:Questrial,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
.brow .val small{color:var(--muted);font-family:"DM Sans",sans-serif;font-size:12px}
.track{grid-column:1/-1;height:9px;border-radius:99px;background:var(--tint);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.2,.7,.2,1)}
/* heat tiles */
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.heat{grid-template-columns:repeat(5,1fr)}}
.heat .t{position:relative;border-radius:var(--r-md);border:1px solid var(--border);padding:14px 6px 10px;text-align:center;font-size:11.5px;font-weight:500;line-height:1.25;background:color-mix(in srgb,var(--accent) calc(var(--p)*1%),var(--surface-2));color:var(--text)}
.heat .t[style*="--p:0"]{opacity:.7}
.heat .t svg{color:var(--accent-soft);margin-bottom:6px}
.heat .t.hot{color:#fff}
.heat .t.hot svg{color:#fff}
.heat .t b{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:var(--pill);background:var(--deep);color:#fff;font-size:12px;display:grid;place-items:center;font-family:Questrial,sans-serif;border:1px solid rgba(255,255,255,.15)}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--pill);background:var(--tint);font-size:13px;font-weight:500}
.tag b{font-family:Questrial,sans-serif;font-size:12px;background:var(--accent);color:#fff;border-radius:var(--pill);padding:1px 8px}
.empty{color:var(--muted);font-size:14px}
/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 12px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--border)}
.fitem.new{border-color:var(--ok);background:var(--ok-tint)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-family:Questrial,sans-serif;display:grid;place-items:center;font-size:14px}
.fitem .who{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.fitem .who b{font-weight:600}
.fitem .who span{color:var(--muted)}
.fitem .who time{margin-left:auto;color:var(--muted);font-size:12px}
.fitem .q{margin-top:5px;font-size:14.5px;line-height:1.45}
.fitem .lvl{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-soft);background:var(--tint);padding:3px 9px;border-radius:var(--pill)}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.tools .grp{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 16px;border-radius:var(--r-md);font-weight:500;font-size:14px;box-shadow:var(--shadow);z-index:9;animation:enter .25s;border:1px solid rgba(255,255,255,.12)}
/* footer */
.foot{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:var(--muted);font-size:12.5px;padding:18px 8px 0;border-top:1px solid var(--border)}
.foot .fb{font-family:Questrial,sans-serif;color:var(--text);letter-spacing:.06em;font-size:14px}
.foot .ft{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-soft)}
.foot .fl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--accent)}
.hero .hero-bg,.hero .hero-shade,.card .card-art,.rhead .card-art{position:absolute}
/* ---- phone layout ---- */
@media (max-width:480px){
  .brand small{display:none}
  .card-art{width:220px;height:220px;right:-44px;top:-30px}
  .panel h3{flex-wrap:wrap}
  .panel h3 .n{margin-left:0;width:100%;margin-top:2px}
}
@media (max-width:600px){
  .hero{padding-top:80px;min-height:380px}
  .hero .btn-ghost{display:none}
}
@media (max-width:559px){
  .step-nav{position:sticky;bottom:0;z-index:2;margin:18px -20px -22px;padding:12px 20px 18px;background:linear-gradient(to top,var(--surface) 72%,transparent)}
  .process{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 6px;scrollbar-width:none}
  .process::-webkit-scrollbar{display:none}
  .pcard{scroll-snap-align:start}
  .rhead{padding:6px 4px;background:transparent;border:0;box-shadow:none}
  .rhead .card-art{display:none}
  .foot.mini{padding-top:12px}
}
.foot.mini{gap:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function store(kind,k,v){try{var s=kind==='s'?sessionStorage:localStorage;if(v===undefined)return JSON.parse(s.getItem(k)||'null');if(v===null)s.removeItem(k);else s.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function ss(k,v){return store('s',k,v);}
function ls(k,v){return store('l',k,v);}
function ago(iso){var d=(Date.now()-new Date(iso).getTime())/1000;if(!(d>=0))return '';if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' h ago';return Math.floor(d/86400)+' d ago';}
function pct(n,t){return t?Math.round(100*n/t):0;}
function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
function byKey(arr,k){for(var i=0;i<arr.length;i++)if(arr[i].k===k)return arr[i];return null;}
function labelOf(arr,k){var o=byKey(arr,k);return o?(o.s||o.t):k;}
function newDraft(){return{name:'',company:'',email:'',phone:'',based:'',role:'',level:'',excites:[],excitesOther:'',make:[],makeOther:'',help:'',wants:[],wantsOther:''};}
function toggleIn(list,v){var i=list.indexOf(v);if(i<0)list.push(v);else list.splice(i,1);}

/* ---------------- backend API (Google Apps Script web app, see backend/Code.gs) ---------------- */
function apiGet(params){
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  return fetch(CONFIG.ENDPOINT+'?'+q+'&_='+Date.now(),{method:'GET',cache:'no-store'}).then(function(x){return x.json();});
}
function apiPost(body){
  /* text/plain keeps this a "simple" request, so Apps Script needs no CORS preflight */
  return fetch(CONFIG.ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(x){return x.json();});
}
var API={
  submit:function(r){return DEMO?Promise.resolve(demo.add(r)):apiPost({action:'submit',response:r});},
  list:function(key){return DEMO?Promise.resolve({ok:true,responses:demo.all()}):apiGet({action:'list',key:key});},
  count:function(){return DEMO?Promise.resolve({ok:true,count:demo.all().length}):apiGet({action:'count'});},
  clear:function(key){return DEMO?Promise.resolve(demo.clear()):apiPost({action:'clear',key:key});}
};
var demo={
  all:function(){return ls('tl-demo')||[];},
  add:function(r){var a=demo.all();if(!a.some(function(x){return x.id===r.id;}))a.push(r);ls('tl-demo',a);return {ok:true};},
  clear:function(){ls('tl-demo',null);return {ok:true};}
};
/* offline queue: responses that could not be sent are kept on the device and re-sent automatically */
function queueAdd(r){var q=ls('tl-queue')||[];if(!q.some(function(x){return x.id===r.id;}))q.push(r);ls('tl-queue',q);}
function queueFlush(){
  var q=ls('tl-queue')||[];if(!q.length||DEMO)return Promise.resolve(0);
  var sent=0;
  return q.reduce(function(p,r){return p.then(function(){return API.submit(r).then(function(res){if(res&&res.ok){sent++;var rest=(ls('tl-queue')||[]).filter(function(x){return x.id!==r.id;});ls('tl-queue',rest.length?rest:null);}});}).catch(function(){});},Promise.resolve()).then(function(){return sent;});
}

function countList(field,options){

  return options.map(function(o){return{o:o,n:c[o.k]||0};});
}
function topText(field,limit){

  return Object.keys(c).map(function(k){return c[k];}).sort(function(a,b){return b.n-a.n;}).slice(0,limit);
}

    (function(){var o=rs.filter(function(r){return r.excitesOther;}).map(function(r){return r.excitesOther;});return o.length?'<p class="hint" style="margin-top:12px"><b>Other:</b> '+o.map(esc).join(' · ')+'</p>':'';})()+'</section>';

    (function(){var o=rs.filter(function(r){return r.makeOther;}).map(function(r){return r.makeOther;});return o.length?'<p class="hint" style="margin-top:12px"><b>Their ideas:</b> '+o.map(esc).join(' · ')+'</p>':'';})()+'</section>';

function render(){
  var html='';
  if(view==='intro')html=renderIntro();
  else if(view==='step')html=renderStep();
  else if(view==='saving')html=renderSaving();
  else if(view==='thanks')html=renderThanks();
  else if(view==='results')html=renderResults();
  app.innerHTML='<div class="shell">'+renderTop()+html+renderFoot()+'</div>';
  if(view!==lastView){window.scrollTo(0,0);lastView=view;}
  if(view==='results'){
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      app.querySelectorAll('.fill').forEach(function(f){f.style.width=f.getAttribute('data-w')+'%';});
      app.querySelectorAll('.ladder .bar').forEach(function(b){b.style.height=Math.max(2,+b.getAttribute('data-h'))+'%';});
    });});
    seenCount=state.responses.length;startPoll();
  }else stopPoll();
  if(view==='thanks')startCountdown();else stopCountdown();
}
function toast(msg){var t=document.querySelector('.toast');if(t)t.remove();var el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.remove();},2600);}
function startCountdown(){stopCountdown();var n=20;thanksTimer=setInterval(function(){n--;var el=document.getElementById('cd');if(el)el.textContent=n;if(n<=0){stopCountdown();draft=newDraft();stepIdx=0;view='intro';render();}},1000);}
function stopCountdown(){if(thanksTimer){clearInterval(thanksTimer);thanksTimer=null;}}

/* ---------------- validation & flow ---------------- */
function validate(){
  var id=STEPS[stepIdx].id;
  if(id==='about'){if(!draft.name.trim())return 'Please tell us your name so we know who to thank.';if(draft.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.email.trim()))return 'That email address doesn\u2019t look right — check it or leave it blank.';}
  if(id==='level'&&!draft.level)return 'Pick the option that fits you best.';
  return '';
}
function cleanResponse(r){
  var o={id:r.id,ts:r.ts};
  ['name','company','email','phone','based','role','level','excitesOther','makeOther','wantsOther','help'].forEach(function(k){o[k]=String(r[k]||'').trim().slice(0,600);});
  ['excites','make','wants'].forEach(function(k){o[k]=(r[k]||[]).slice();});
  if(o.excites.indexOf('other')<0)o.excitesOther='';if(o.make.indexOf('other')<0)o.makeOther='';if(o.wants.indexOf('other')<0)o.wantsOther='';
  return o;
}
function sendResponse(r){
  API.submit(r).then(function(res){
    if(!(res&&res.ok))throw new Error(res&&res.error||'rejected');
    thanksMode=DEMO?'demo':'shared';view='thanks';render();
    if(total!==null)total++;
  }).catch(function(){
    queueAdd(r);thanksMode='queued';view='thanks';render();
  });
}
function submitDraft(){
  var r=cleanResponse(Object.assign({id:uid(),ts:new Date().toISOString()},draft));
  view='saving';render();sendResponse(r);
}
/* admin dashboard data */
function loadResults(silent){
  return API.list(adminKey).then(function(res){
    if(!(res&&res.ok)){if(res&&res.error==='unauthorized'){adminKey='';ls('tl-admin-key',null);adminErr='That key was not accepted.';}else adminErr='Could not load responses \u2014 check the endpoint.';if(view==='results')render();return;}
    var before=state.responses.length;
    state.responses=(res.responses||[]).map(normalize);lastSync=new Date().toISOString();adminErr='';
    if(view==='results'&&(!silent||state.responses.length!==before))render();
  }).catch(function(){adminErr='Could not reach the backend.';if(view==='results'&&!silent)render();});
}
function normalize(r){
  var o={};['id','ts','name','company','email','phone','based','role','level','excitesOther','makeOther','wantsOther','help'].forEach(function(k){o[k]=String(r[k]==null?'':r[k]);});
  ['excites','make','wants'].forEach(function(k){var v=r[k];o[k]=Array.isArray(v)?v:String(v||'').split(/;\s*/).filter(Boolean);});
  return o;
}
function startPoll(){stopPoll();if(DEMO)return;pollTimer=setInterval(function(){if(view==='results'&&adminKey)loadResults(true);},CONFIG.POLL_MS);}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
function toCSV(){
  var cols=['ts','name','company','email','phone','based','role','level','excites','excitesOther','make','makeOther','help','wants','wantsOther'];
  var q=function(v){v=Array.isArray(v)?v.join('; '):String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"';};
  return cols.join(',')+'\n'+state.responses.map(function(r){return cols.map(function(c){return q(r[c]);}).join(',');}).join('\n')+'\n';
}
function saveFile(name,data){
  try{var blob=new Blob([data],{type:name.slice(-4)==='.csv'?'text/csv;charset=utf-8':'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);toast('Downloading '+name);}
  catch(e){copyText(data,'Copied to clipboard instead');}
}
function copyText(text,msg){
  var done=function(){toast(msg||'Copied');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,function(){toast('Couldn\u2019t copy — select and copy manually');});
  else toast('Copy isn\u2019t available in this browser');
}
function myLatest(){var m=ls('tl-local')||[];return m[m.length-1];}
function describe(r){
  return ['Name: '+r.name,'Company: '+r.company,'Email: '+r.email,'Phone: '+r.phone,'Based: '+r.based,'Role: '+r.role,'Knowledge: '+labelOf(LEVELS,r.level),'Excites: '+r.excites.map(function(k){return labelOf(EXCITES,k);}).join(', ')+(r.excitesOther?' ('+r.excitesOther+')':''),'Wants made: '+r.make.map(function(k){return labelOf(MAKE,k);}).join(', ')+(r.makeOther?' ('+r.makeOther+')':''),'How it helps: '+r.help,'Follow-ups: '+r.wants.map(function(k){return labelOf(WANTS,k);}).join(', ')+(r.wantsOther?' ('+r.wantsOther+')':'')].join('\n');
}

  if(a==='start'){draft=newDraft();stepIdx=0;err='';view='step';render();}
  else if(a==='results'){view='results';render();if(adminKey||DEMO)loadResults(false);}
  else if(a==='login'){var k=(document.getElementById('f-adminkey')||{}).value||'';if(!k.trim()){adminErr='Enter the admin key.';render();return;}adminKey=k.trim();ls('tl-admin-key',adminKey);adminErr='';view='results';render();loadResults(false);}
  else if(a==='signout'){adminKey='';ls('tl-admin-key',null);state.responses=[];view='intro';location.hash='';render();}
  else if(a==='survey'){view='intro';if(location.hash)history.replaceState(null,'',location.pathname+location.search);render();}
  else if(a==='restart'){draft=newDraft();stepIdx=0;view='intro';render();}
  else if(a==='back'){err='';if(stepIdx===0)view='intro';else stepIdx--;render();}
  else if(a==='next'){err=validate();if(err){render();return;}if(stepIdx<STEPS.length-1){stepIdx++;render();}else submitDraft();}
  else if(a==='pick'){draft[el.getAttribute('data-field')]=el.getAttribute('data-val');err='';render();}
  else if(a==='multi'){toggleIn(draft[el.getAttribute('data-field')],el.getAttribute('data-val'));err='';render();var f=el.getAttribute('data-field');var inp=document.getElementById('f-'+f+'Other');if(inp&&el.getAttribute('data-val')==='other')inp.focus();}
  else if(a==='suggest'){var ta=document.getElementById('f-help');var s=el.getAttribute('data-val');draft.help=draft.help.trim()?draft.help.trim()+' '+s:s;if(ta){ta.value=draft.help;ta.focus();}var c=document.getElementById('help-count');if(c)c.textContent=draft.help.length+' / 600';}
  else if(a==='export'){if(!state.responses.length)return toast('No responses to export yet');saveFile('tynmas-feedback.csv',toCSV());}
  else if(a==='copy'){var m=myLatest();if(m)copyText(describe(m),'Your answers are copied');}
  else if(a==='dlmine'){var m2=myLatest();if(m2)saveFile('my-tynmas-feedback.txt',describe(m2));}
  else if(a==='clear'){
    if(!clearArmed){clearArmed=true;render();clearTimeout(clearTimer);clearTimer=setTimeout(function(){clearArmed=false;if(view==='results')render();},4000);return;}
    clearArmed=false;clearTimeout(clearTimer);toast('Clearing\u2026');
    API.clear(adminKey).then(function(res){if(!(res&&res.ok))throw new Error();state.responses=[];seenCount=0;total=0;render();toast('All responses cleared');}).catch(function(){toast('Couldn\u2019t clear \u2014 check the key and endpoint');});
  }
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='f-adminkey'){e.preventDefault();var b=app.querySelector('[data-action="login"]');if(b)b.click();}});
window.addEventListener('hashchange',route);
window.addEventListener('online',function(){queueFlush().then(function(n){if(n)toast(n+' saved response'+(n===1?'':'s')+' sent');});});
app.addEventListener('input',function(e){
  var el=e.target;var f=el.getAttribute&&el.getAttribute('data-field');if(!f)return;
  draft[f]=el.value;
  if(f==='help'){var c=document.getElementById('help-count');if(c)c.textContent=el.value.length+' / 600';}
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&view==='step'){e.preventDefault();var n=app.querySelector('[data-action="next"]');if(n)n.click();}
});

/* ---------------- boot: recover a pending submission after a reload ---------------- */
function route(){
  if(location.hash==='#admin'||location.hash==='#results'){view='results';render();if(adminKey||DEMO)loadResults(false);}
  else if(view==='results'){view='intro';render();}
}
(function boot(){
  if(location.hash==='#admin'||location.hash==='#results'){view='results';}
  render();
  if(view==='results'&&(adminKey||DEMO))loadResults(false);
  API.count().then(function(res){if(res&&res.ok){total=Number(res.count)||0;if(view==='intro')render();}}).catch(function(){});
  queueFlush().then(function(n){if(n)toast(n+' saved response'+(n===1?'':'s')+' sent');});
})();
})();
</script>
</body>
</html>
